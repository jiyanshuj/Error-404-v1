<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-image: url('https://i.pinimg.com/originals/aa/bd/ef/aabdef645699b1228b87b79f8f645440.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Roboto', sans-serif;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .card {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6),
                        0 0 0 1px rgba(59, 130, 246, 0.15);
            overflow: hidden;
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 1;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6 0%, #06b6d4 100%);
            z-index: 1;
        }

        .card-header {
            text-align: center;
            padding: 2.5rem 1.5rem 1.5rem;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(6, 182, 212, 0.15));
            position: relative;
        }

        .card-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(59, 130, 246, 0.5), 
                rgba(6, 182, 212, 0.5), 
                transparent);
        }

        .card-title {
            font-size: 2.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: -1px;
        }

        .card-content {
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.75rem;
        }

        label {
            display: block;
            color: #e2e8f0;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 0.6rem;
            font-family: 'Roboto', sans-serif;
            letter-spacing: 0.3px;
        }

        .input {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            border: 2px solid rgba(59, 130, 246, 0.2);
            border-radius: 10px;
            color: #ffffff;
            padding: 0.9rem 1rem;
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(30, 41, 59, 0.8);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15),
                        0 0 20px rgba(59, 130, 246, 0.3);
        }

        .input:hover {
            border-color: rgba(59, 130, 246, 0.4);
        }

        .input::placeholder {
            color: #94a3b8;
        }

        .date-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .date-grid .form-group {
            margin-bottom: 0;
        }

        .button {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            color: white;
            font-weight: 600;
            font-size: 1.125rem;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Roboto', sans-serif;
            margin-top: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.2), 
                transparent);
            transition: left 0.5s ease;
        }

        .button:hover::before {
            left: 100%;
        }

        .button:hover {
            background: linear-gradient(135deg, #2563eb 0%, #0891b2 100%);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .button:active {
            transform: translateY(0);
        }

        footer {
            color: rgba(226, 232, 240, 0.7);
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
            font-family: 'Roboto', sans-serif;
            margin-top: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Input date styling */
        input[type="date"] {
            cursor: pointer;
            color-scheme: dark;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }

        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 1;
            cursor: pointer;
        }

        /* Add subtle animation on load */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeIn 0.6s ease;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.5rem;
            }

            .card {
                max-width: 100%;
                margin: 0;
                border-radius: 16px;
            }

            .card-title {
                font-size: 2.25rem;
            }

            .card-header {
                padding: 2rem 1rem 1rem;
            }

            .card-content {
                padding: 1.75rem 1.5rem;
            }

            .date-grid {
                grid-template-columns: 1fr;
                gap: 1.75rem;
            }

            .date-grid .form-group {
                margin-bottom: 0;
            }

            .button {
                font-size: 1rem;
                padding: 0.9rem;
            }
        }

        @media (max-width: 400px) {
            .card-title {
                font-size: 2rem;
            }

            .card-content {
                padding: 1.5rem 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h1 class="card-title">Travel Search</h1>
        </div>
        <div class="card-content">
            <div class="form-group">
                <label for="current">Your Current Location</label>
                <input id="current" class="input" placeholder="Enter your location" />
            </div>
            
            <div class="form-group">
                <label for="destination">Where would you like to go?</label>
                <input id="destination" class="input" placeholder="Enter destination" />
            </div>
            
            <div class="form-group">
                <div class="date-grid">
                    <div class="form-group">
                        <label for="start-date">Starting Date</label>
                        <input type="date" id="start-date" class="input" />
                    </div>
                    <div class="form-group">
                        <label for="end-date">Ending Date</label>
                        <input type="date" id="end-date" class="input" />
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="people">Number of People</label>
                <input id="people" type="number" min="1" class="input" placeholder="Enter number of travelers" />
            </div>
            
            <div class="form-group">
                <label for="budget">Budget</label>
                <input id="budget" type="number" min="0" class="input" placeholder="Enter your budget" />
            </div>
            
            <button class="button" onclick="alert('Searching for your perfect trip...')">Search</button>
        </div>
    </div>
    
    <footer>
        &copy; 2024 Team ERROR 404. All rights reserved.
    </footer>
</body>
</html>
